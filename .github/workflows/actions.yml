
name: BuildSystem

on:
  push:
    branches: ["main", "dev"]
    tags:
      - "v*.*.*"
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    permissions:
      contents: read
      checks: write

    name: Run Unity Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Unity-Library-${{ runner.os }}-StandaloneWindows64-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Unity-Library-${{ runner.os }}-StandaloneWindows64-

      - name: Run Unity PlayMode tests
        uses: game-ci/unity-test-runner@c609e5c8e6d256ee6f61b8cebaaa3fe8b0b9469f
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.8f1
          testMode: playmode
          coverageEnabled: false
          artifactsPath: artifacts/playmode

      - name: Run Unity EditMode tests
        uses: game-ci/unity-test-runner@c609e5c8e6d256ee6f61b8cebaaa3fe8b0b9469f
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.8f1
          testMode: editmode
          coverageEnabled: false
          artifactsPath: artifacts/editmode

      - name: Return license
        uses: game-ci/unity-return-license@v2
        if: always()

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-Results
          path: artifacts

  native-plugin:
    permissions:
      contents: read

    name: Check Native Plugin (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: macos-latest
            platform: macOS
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify universal Mac binary and signature
        if: runner.os == 'macOS'
        run: |
          xcrun lipo Assets/Plugins/macOS/libSiliconPlugin.dylib -verify_arch arm64 x86_64
          codesign --verify --strict Assets/Plugins/macOS/libSiliconPlugin.dylib

      - name: Check committed native plugin through managed wrapper
        run: dotnet run -c Release --project native/SiliconPlugin/tests/PluginCheck

  build:
    name: Build Windows Game
    needs: [test, native-plugin]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Unity-Library-${{ runner.os }}-StandaloneWindows64-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Unity-Library-${{ runner.os }}-StandaloneWindows64-

      - name: Build Windows application
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.8f1
          targetPlatform: StandaloneWindows64
          buildName: Game
          buildPath: build

      # NEW: Install Syft for dependency scanning
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      # NEW: Confirm the build directory exists
      - name: Verify Windows build output
        run: |
          find build -maxdepth 5 -type f \( -name 'Game.exe' -o -name 'UnityPlayer.dll' \) -print
          test -d build/StandaloneWindows64 || {
            echo "Expected build directory not found"
            find build -maxdepth 3 -type d
            exit 1
          }

      # MODIFIED: Generate the Unity SBOM as an intermediate file
      - name: Generate Unity package SBOM
        run: |
          mkdir -p doc/sbom-parts
          python3 Assets/Scripts/generate_unity_sbom.py --output doc/sbom-parts/unity.json

      # NEW: Scan the compiled Windows game
      - name: Scan built Windows game
        run: |
          syft dir:build/StandaloneWindows64 \
            -o spdx-json=doc/sbom-parts/windows.json

      # NEW: Scan additional plugins and native source
      - name: Scan project plugins and native source
        run: |
          if [ -d Assets/Plugins ]; then
            syft dir:Assets/Plugins \
              -o spdx-json=doc/sbom-parts/plugins.json
          fi

          if [ -d native ]; then
            syft dir:native \
              -o spdx-json=doc/sbom-parts/native.json
          fi

      # NEW: Merge the scans into one final SPDX SBOM
      - name: Merge SPDX package inventories
        run: |
          python3 Assets/Scripts/merge_sboms.py \
            --unity doc/sbom-parts/unity.json \
            --scans doc/sbom-parts/windows.json doc/sbom-parts/plugins.json doc/sbom-parts/native.json \
            --output doc/SBOM.json

      # MODIFIED: Upload final and intermediate SBOM files
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: SiliconSandbox-SBOM
          path: |
            doc/SBOM.json
            doc/sbom-parts/*.json

      # MODIFIED: Commit only on main/dev branch pushes
      - name: Commit and push updated SBOM
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add doc/SBOM.json

          if git diff --cached --quiet; then
            echo "SBOM is already up to date."
          else
            git commit -m "Automatically update SBOM [skip ci]"
            git push
          fi

      - name: Return license
        uses: game-ci/unity-return-license@v2
        if: always()

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SiliconSandbox-${{ github.event.number || github.run_number }}-Windows
          path: build
