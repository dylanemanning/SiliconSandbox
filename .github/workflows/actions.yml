name: BuildSystem

on:
  push:
    branches: ["main", "dev"]
    tags: 
      - "v*.*.*"
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

jobs:
  test:
    permissions:
      contents: read
      checks: write
  
    name: Run Unity Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Unity-Library-${{ runner.os }}-StandaloneWindows64-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Unity-Library-${{ runner.os }}-StandaloneWindows64-

      - name: Run Unity PlayMode tests
        uses: game-ci/unity-test-runner@c609e5c8e6d256ee6f61b8cebaaa3fe8b0b9469f
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.8f1
          testMode: playmode
          coverageEnabled: false
          artifactsPath: artifacts/playmode

      - name: Run Unity EditMode tests
        uses: game-ci/unity-test-runner@c609e5c8e6d256ee6f61b8cebaaa3fe8b0b9469f
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.8f1
          testMode: editmode
          coverageEnabled: false
          artifactsPath: artifacts/editmode

      - name: Return license
        uses: game-ci/unity-return-license@v2
        if: always()

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-Results
          path: artifacts

  native-plugin:
    permissions:
      contents: read

    name: Check Native Plugin (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: macos-latest
            platform: macOS
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # macOS: test the committed dylib, then rebuild it from source and test that.
      # A failure here only means the committed copy is stale; the last step reports it.
      - name: Check committed Mac plugin
        id: committed_mac
        if: runner.os == 'macOS'
        continue-on-error: true
        run: dotnet run -c Release --project native/SiliconPlugin/tests/PluginCheck

      - name: Build Mac plugin from source
        if: runner.os == 'macOS'
        run: bash native/SiliconPlugin/build-macos.sh

      - name: Upload freshly built Mac plugin
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: libSiliconPlugin-macOS
          path: Assets/Plugins/macOS/libSiliconPlugin.dylib
          if-no-files-found: error

      - name: Verify universal Mac binary and signature
        if: runner.os == 'macOS'
        run: |
          xcrun lipo Assets/Plugins/macOS/libSiliconPlugin.dylib -verify_arch arm64 x86_64
          codesign --verify --strict Assets/Plugins/macOS/libSiliconPlugin.dylib

      # Windows: committed DLL. macOS: the dylib just built from source.
      - name: Check native plugin through managed wrapper
        run: dotnet run -c Release --project native/SiliconPlugin/tests/PluginCheck

      - name: Fail if committed Mac plugin is out of date
        if: runner.os == 'macOS' && steps.committed_mac.outcome == 'failure'
        run: |
          echo "::error file=Assets/Plugins/macOS/libSiliconPlugin.dylib::The committed Mac plugin is out of date with native/SiliconPlugin/src. Download the libSiliconPlugin-macOS artifact from this run and commit it to Assets/Plugins/macOS/ (keep the existing .meta)."
          exit 1

  build:
    name: Build Windows Game
    needs: [test, native-plugin]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Unity-Library-${{ runner.os }}-StandaloneWindows64-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Unity-Library-${{ runner.os }}-StandaloneWindows64-

      - name: Build Windows application
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.8f1
          targetPlatform: StandaloneWindows64
          buildName: Game
          buildPath: build

      - name: Return license
        uses: game-ci/unity-return-license@v2
        if: always()

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SiliconSandbox-${{ github.event.number || github.run_number }}-Windows
          path: build